name: build-gcc

on:
  push:
    branches: ["master", "linux"]
  pull_request:
    branches: ["master", "linux"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up GCC (MinGW)
        uses: bwoodsend/setup-winlibs-action@v1
        with:
          with_clang: false

      - name: Configure
        run: cmake -G "MinGW Makefiles" -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release
      - name: Build
        run: dir
      - name: Build
        run: cd build
      - name: Build
        run: dir

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAFFeinated
          path: D:/a/CAFFeinatedLinux/CAFFeinatedLinux/build/bin/CAFFeinated.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: D:/a/CAFFeinatedLinux/CAFFeinatedLinux/build/bin/CAFFeinated.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
